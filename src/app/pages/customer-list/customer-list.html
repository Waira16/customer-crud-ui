<mat-card>
  <mat-card-content>
    <div *ngIf="isLoading" style="display: flex; justify-content: center; padding: 20px;">
      <mat-spinner></mat-spinner>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" *ngIf="!isLoading">
      <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef> ID </th><td mat-cell *matCellDef="let element"> {{element.id}} </td></ng-container>
      <ng-container matColumnDef="firstName"><th mat-header-cell *matHeaderCellDef> Ad </th><td mat-cell *matCellDef="let element"> {{element.firstName}} </td></ng-container>
      <ng-container matColumnDef="lastName"><th mat-header-cell *matHeaderCellDef> Soyad </th><td mat-cell *matCellDef="let element"> {{element.lastName}} </td></ng-container>
      <ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef> Email </th><td mat-cell *matCellDef="let element"> {{element.email}} </td></ng-container>
      <ng-container matColumnDef="phone"><th mat-header-cell *matHeaderCellDef> Tel </th><td mat-cell *matCellDef="let element"> {{element.phone}} </td></ng-container>
      
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> İşlemler </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="editCustomer(element.id)"> <mat-icon>edit</mat-icon> </button>
          <button mat-icon-button (click)="deleteCustomer(element.id)"> <mat-icon>delete</mat-icon> </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
