<h2 mat-dialog-title>{{ isEdit ? 'Tarife Düzenle' : 'Yeni Tarife Ekle' }}</h2>

<mat-dialog-content>
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Tarife Adı</mat-label>
      <input matInput [(ngModel)]="form.name" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tür</mat-label>
      <mat-select [(ngModel)]="form.type" required>
        <mat-option value="FIBER">Fiber</mat-option>
        <mat-option value="DSL">DSL</mat-option>
        <mat-option value="MOBILE">Mobil</mat-option>
        <mat-option value="TV">TV</mat-option>
        <mat-option value="DIGITAL_SERVICE">Dijital Hizmet</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>İnternet (GB)</mat-label>
      <input matInput type="number" min="0" [(ngModel)]="form.dataGB" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dakika</mat-label>
      <input matInput type="number" min="0" [(ngModel)]="form.minutes" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Aylık Fiyat (₺)</mat-label>
      <input matInput type="number" min="0" step="0.01" [(ngModel)]="form.price" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Görsel URL (opsiyonel)</mat-label>
      <input matInput [(ngModel)]="form.imageUrl" />
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Vazgeç</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="!isValid()">
    {{ isEdit ? 'Güncelle' : 'Ekle' }}
  </button>
</mat-dialog-actions>
