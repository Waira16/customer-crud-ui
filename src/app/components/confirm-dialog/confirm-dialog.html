<div class="confirm-dialog">
  <div class="confirm-header">
    <mat-icon>{{ data.destructive ? 'warning_amber' : 'help_outline' }}</mat-icon>
    <h2>{{ data.title }}</h2>
  </div>

  <p class="confirm-message">{{ data.message }}</p>

  <div class="confirm-actions">
    <button type="button" mat-stroked-button (click)="cancel()">
      {{ data.cancelText || 'İptal' }}
    </button>
    <button
      type="button"
      mat-flat-button
      [class.destructive-btn]="data.destructive"
      (click)="confirm()">
      {{ data.confirmText || 'Evet' }}
    </button>
  </div>
</div>
